name: Build Texture Valley

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    name: Test generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow
      - name: Check Python syntax
        run: python -m compileall -q main.py core tests
      - name: Run generator tests
        run: python -m unittest discover -s tests -v
      - name: Package source
        run: |
          mkdir -p dist
          zip -r dist/Texture-Valley-PC-Source.zip main.py core requirements.txt README.md
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Texture-Valley-PC-Source
          path: dist/Texture-Valley-PC-Source.zip
          if-no-files-found: error

  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name TextureValley --collect-data kivy --collect-binaries kivy main.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Texture-Valley-Windows
          path: dist/TextureValley/
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36
      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
      - name: Build debug APK (accept Android SDK licenses)
        shell: bash
        run: |
          export ACLOCAL_PATH=/usr/share/aclocal
          autoreconf --version
          yes | buildozer android debug
      - name: Verify APK exists
        shell: bash
        run: test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Texture-Valley-Android-APK
          path: bin/*.apk
          if-no-files-found: error
